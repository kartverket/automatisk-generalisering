name: Checks

# Runs the same checks a commit runs: the hooks in .pre-commit-config.yaml, from the tool
# versions pinned in pyproject.toml's dev extra, on both runners the team's platforms map
# to (Windows for development, Linux for the image). Neither runner has ArcPy, on purpose:
# an `import arcpy` outside the adapter fails here, and the pytest hook excludes the
# arcpy-marked tests by marker.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the project and the dev tools
        run: pip install -e ".[dev]"

      - name: Run every check
        run: pre-commit run --all-files --show-diff-on-failure
